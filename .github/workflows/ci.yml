name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: OpenChamber quota extension
        working-directory: openchamber-quota
        run: |
          bun install --frozen-lockfile
          bun x tsc --noEmit
          bun run test
          bun run build
          git diff --exit-code -- service/main.js
